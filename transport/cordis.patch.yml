# dsh-pocket-transport 的组合补丁（由根包 dsh.bundle.patch 列表引入）
#
# 网关心跳放宽（ADR 0005）：覆盖 dsh-base 的 typert-gateway 行（整块替换 config），
# 把 WebSocket 流心跳间隔从 2000ms 放宽到 10000ms（MAX_MISSED_HEARTBEATS=2 → 断链判定窗口
# 从 ~4s 放宽到 ~20s），并将流收件箱缓冲从默认 256 KiB 提升到 1 MiB，消除弱网/隧道抖动下的频繁误杀。
#
# 为什么它在补丁层而不是运行时代码：组合补丁在 row 启动之前由 Loader 组合，gateway 拿到的
# 就是最终配置；运行期再改只能重启 gateway fiber（会切断所有在飞流），不值得。代价是它
# 随本包安装始终生效，不随组件 row 的开关切换——组件开关控制的是缓存 / 自愈这些运行时能力。
#
# 若后续 profile/home/overlay 层再次覆盖该行，只影响重连容忍度，不影响协议正确性。
#
# `name` 是**守卫**，不是冗余：applyEntryPatches 只在 patch 提供 name 时才做一致性校验，
# 否则一旦有别的 bundle 复用了 `typert-gateway` 这个 id，这段 config 会被静默套到错误的插件上
# （被对方 schema 拒绝或直接忽略，都不报错）。写上 name 后，id 冲突会退化成
# `patch: name mismatch for "typert-gateway"` 警告 + 跳过，而不是改错东西。
- id: typert-gateway
  name: '@deepseek-ai/dsh-api-gateway'
  config:
    websocketHeartbeatIntervalMs: 10000
    streamInboxBytes: 1048576
